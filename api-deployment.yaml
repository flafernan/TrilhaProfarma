apiVersion: apps/v1
kind: Deployment
metadata:
  name: profarma-trilha-api
  labels:
    app: profarma-trilha-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profarma-trilha-api
  template:
    metadata:
      labels:
        app: profarma-trilha-api
    spec:
      serviceAccountName: sa-profarma-trilha
      containers:
      - name: api
        image: mcr.microsoft.com/dotnet/samples:aspnetapp-chiseled-9.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-provider"
---
apiVersion: v1
kind: Service
metadata:
  name: profarma-trilha-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: profarma-trilha-api