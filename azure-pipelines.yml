trigger:
  branches:
    include: [develop, main]

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageRepo: 'profarma/api-trilha'
  tag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: 'Stage de Build e Push'
  jobs:
  - job: BuildAndPush
    displayName: 'Build Docker Image'
    steps:
    - task: Docker@2
      inputs:
        containerRegistry: 'acr-sandbox-svc'
        repository: $(imageRepo)
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)
          latest

- stage: Deploy
    displayName: 'Stage de Deploy'
    dependsOn: Build
    jobs:
    - deployment: DeployToAKS
      displayName: 'Job DeployToAKS'
      environment: 'aks-sandbox'
      pool:
        vmImage: 'ubuntu-latest'
      strategy:
        runOnce:
          deploy:
            steps:
            - script: |
                echo "Simulando a conexao com o AKS..."
                echo "Aplicando os manifestos da TrilhaProfarma no namespace-trilha..."
                echo "Deploy realizado com sucesso para o ambiente de Sandbox!"
              displayName: 'Simulação de Deploy no AKS (Evidência)'